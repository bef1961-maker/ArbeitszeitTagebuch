<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArbeitszeitTagebuch - PWA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f7;
            margin: 0;
            padding: 12px;
            color: #000;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #007aff;
            border-bottom: 1px solid #e5e5ea;
            padding-bottom: 8px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 10px;
            margin-bottom: 4px;
            color: #3a3a3c;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #c7c7cc;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row > div {
            flex: 1;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
        }
        .btn-primary { background-color: #007aff; color: #fff; }
        .btn-secondary { background-color: #5856d6; color: #fff; }
        .btn-danger { background-color: #ff3b30; color: #fff; margin-top: 8px; }
        .status-bar {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .entry-item {
            border-left: 4px solid #007aff;
            padding: 8px 12px;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .entry-pause {
            border-left-color: #ff9500;
            background-color: #fffbe6;
        }
    </style>
</head>
<body>

    <div id="syncStatus" class="status-bar" style="background-color: #eef6ff; color: #007aff;">
        ⏳ Verbinde mit Firebase Cloud...
    </div>

    <!-- 1. Stammdaten & Tag -->
    <div class="card">
        <h2>1. Stammdaten & Tag</h2>
        <label for="userName">Mitarbeiter / Name:</label>
        <input type="text" id="userName" placeholder="Dein Name">

        <label for="workDate">Datum:</label>
        <input type="date" id="workDate">

        <div class="row">
            <div>
                <label for="timeFrom">Von:</label>
                <input type="time" id="timeFrom" onchange="adjustToTime()">
            </div>
            <div>
                <label for="timeTo">Bis:</label>
                <input type="time" id="timeTo">
            </div>
        </div>
    </div>

    <!-- 2. Tätigkeit erfassen -->
    <div class="card">
        <h2>2. Tätigkeit erfassen</h2>
        <label for="serviceSelect">Dienstart (Kategorie):</label>
        <select id="serviceSelect" onchange="updateActivities()"></select>

        <label for="activitySelect">Tätigkeit:</label>
        <select id="activitySelect" onchange="updateDescriptions()"></select>

        <label for="descriptionSelect">Details / Beschreibung:</label>
        <select id="descriptionSelect"></select>

        <button class="btn btn-primary" onclick="addEntry()">+ Eintrag speichern</button>
        <button class="btn btn-secondary" onclick="addPause()">+ Pause eintragen (30 Min)</button>
    </div>

    <!-- 3. Erfasste Einträge -->
    <div class="card">
        <h2>3. Erfasste Einträge</h2>
        <div id="entriesList"><i>Noch keine Einträge erfasst.</i></div>
        <button class="btn btn-danger" onclick="clearEntries()">Alle Einträge löschen</button>
    </div>

    <!-- 4. Initialisierung -->
    <div class="card">
        <h2>4. Initialisierung</h2>
        <label for="jsonImport">Stammdaten-JSON importieren:</label>
        <input type="file" id="jsonImport" accept=".json" onchange="importDataToCloud(event)">
    </div>

    <script>
        // Exakte Europe-West1 URL aus deiner Firebase-Konsole
        const BASE_FIREBASE_URL = "https://arbeitszeittagebuch-default-rtdb.europe-west1.firebasedatabase.app"; 
        const FIREBASE_URL = BASE_FIREBASE_URL + "/.json";

        let db = {
            userName: "",
            ServiceToActivities: {},
            ActivityToDescriptions: {},
            LoggedEntries: []
        };

        window.onload = function() {
            document.getElementById('workDate').valueAsDate = new Date();
            document.getElementById('timeFrom').value = "06:00";
            document.getElementById('timeTo').value = "08:00";

            // 1. Zuerst lokales Backup laden
            let localData = localStorage.getItem('arbeitszeit_db');
            if (localData) {
                try {
                    db = JSON.parse(localData);
                    if (db.userName) document.getElementById('userName').value = db.userName;
                    populateServices();
                    renderEntries();
                } catch(e){}
            }

            // 2. Cloud abrufen
            loadFromFirebase();
        };

        function setStatus(text, color, bg) {
            const el = document.getElementById('syncStatus');
            if (el) {
                el.innerText = text;
                el.style.color = color;
                el.style.backgroundColor = bg;
            }
        }

        function populateServices() {
            const sSelect = document.getElementById('serviceSelect');
            if (!sSelect) return;
            sSelect.innerHTML = '';
            
            if (!db || !db.ServiceToActivities) {
                db.ServiceToActivities = {};
            }

            for (let service in db.ServiceToActivities) {
                let opt = document.createElement('option');
                opt.value = service;
                opt.innerText = service;
                sSelect.appendChild(opt);
            }
            updateActivities();
        }

        function updateActivities() {
            const sSelect = document.getElementById('serviceSelect');
            const aSelect = document.getElementById('activitySelect');
            if (!sSelect || !aSelect) return;
            
            const service = sSelect.value;
            aSelect.innerHTML = '';
            
            if (!db || !db.ServiceToActivities) db.ServiceToActivities = {};
            const activities = db.ServiceToActivities[service] || [];
            
            activities.forEach(act => {
                let opt = document.createElement('option');
                opt.value = act;
                opt.innerText = act;
                aSelect.appendChild(opt);
            });
            updateDescriptions();
        }

        function updateDescriptions() {
            const aSelect = document.getElementById('activitySelect');
            const dSelect = document.getElementById('descriptionSelect');
            if (!aSelect || !dSelect) return;

            const activity = aSelect.value;
            dSelect.innerHTML = '';

            if (!db || !db.ActivityToDescriptions) db.ActivityToDescriptions = {};
            const descriptions = db.ActivityToDescriptions[activity] || [];
            
            descriptions.forEach(desc => {
                let opt = document.createElement('option');
                opt.value = desc;
                opt.innerText = desc;
                dSelect.appendChild(opt);
            });
        }

        async function loadFromFirebase() {
            try {
                const response = await fetch(FIREBASE_URL, {
                    method: 'GET',
                    mode: 'cors',
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data && typeof data === 'object') {
                        db = data;
                        
                        if (!db.ServiceToActivities) db.ServiceToActivities = {};
                        if (!db.ActivityToDescriptions) db.ActivityToDescriptions = {};
                        if (!db.LoggedEntries) db.LoggedEntries = [];
                        
                        if (db.userName) document.getElementById('userName').value = db.userName;
                        
                        localStorage.setItem('arbeitszeit_db', JSON.stringify(db));
                        populateServices();
                        renderEntries();
                        setStatus("● Mit Firebase Cloud synchronisiert", "#2e7d32", "#e8f5e9");
                    } else {
                        setStatus("⚠️ Cloud ist noch leer! Bitte Punkt 4 (JSON importieren) nutzen.", "#e65100", "#fff3e0");
                    }
                } else {
                    setStatus("⚠️ Firebase Fehler Status: " + response.status, "#c62828", "#ffebee");
                }
            } catch (err) {
                console.error("Firebase Ladefehler:", err);
                setStatus("⚠️ Mobil-Fehler: " + (err.message || err), "#c62828", "#ffebee");
            }
        }

        async function saveLocalAndCloud() {
            db.userName = document.getElementById('userName').value;
            localStorage.setItem('arbeitszeit_db', JSON.stringify(db));

            setStatus("⏳ Speichere in Cloud...", "#007aff", "#eef6ff");
            try {
                const response = await fetch(FIREBASE_URL, {
                    method: 'PUT',
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(db)
                });
                if (response.ok) {
                    setStatus("● Automatisch in Cloud gespeichert", "#2e7d32", "#e8f5e9");
                } else {
                    setStatus("⚠️ Speichern fehlgeschlagen (Fehler " + response.status + ")", "#c62828", "#ffebee");
                }
            } catch (err) {
                console.error("Firebase Speicherfehler:", err);
                setStatus("⚠️ Lokale Speicherung OK (Cloud Offline)", "#e65100", "#fff3e0");
            }
        }

        function addMinutesToTime(timeStr, minutesToAdd) {
            let [hours, minutes] = timeStr.split(':').map(Number);
            let date = new Date();
            date.setHours(hours, minutes + minutesToAdd, 0);
            let h = String(date.getHours()).padStart(2, '0');
            let m = String(date.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function adjustToTime() {
            const from = document.getElementById('timeFrom').value;
            if (from) {
                document.getElementById('timeTo').value = addMinutesToTime(from, 120);
            }
        }

        function advanceTimes(minutes = 120) {
            const currentTo = document.getElementById('timeTo').value;
            document.getElementById('timeFrom').value = currentTo;
            document.getElementById('timeTo').value = addMinutesToTime(currentTo, minutes);
        }

        async function addEntry() {
            const name = document.getElementById('userName').value;
            const date = document.getElementById('workDate').value;
            const from = document.getElementById('timeFrom').value;
            const to = document.getElementById('timeTo').value;
            const service = document.getElementById('serviceSelect').value;
            const activity = document.getElementById('activitySelect').value;
            const desc = document.getElementById('descriptionSelect').value;

            if (!date || !from || !to) {
                alert('Bitte Datum, Von- und Bis-Zeit ausfüllen!');
                return;
            }

            const entry = { name, date, from, to, service, activity, desc, id: Date.now() };
            if (!db.LoggedEntries) db.LoggedEntries = [];
            db.LoggedEntries.push(entry);
            
            renderEntries();
            await saveLocalAndCloud();
            advanceTimes(120);
        }

        async function addPause() {
            const name = document.getElementById('userName').value;
            const date = document.getElementById('workDate').value;
            const from = document.getElementById('timeFrom').value;
            const to = addMinutesToTime(from, 30);

            if (!date || !from) {
                alert('Bitte Datum und Von-Zeit ausfüllen!');
                return;
            }

            const entry = { name, date, from, to, service: 'Pause', activity: 'Mittag/Pause', desc: 'Pause', id: Date.now(), isPause: true };
            if (!db.LoggedEntries) db.LoggedEntries = [];
            db.LoggedEntries.push(entry);
            
            renderEntries();
            await saveLocalAndCloud();

            document.getElementById('timeFrom').value = to;
            document.getElementById('timeTo').value = addMinutesToTime(to, 120);
        }

        async function clearEntries() {
            if (confirm("Möchtest du wirklich alle erfassten Einträge löschen?")) {
                db.LoggedEntries = [];
                renderEntries();
                await saveLocalAndCloud();
            }
        }

        function renderEntries() {
            const container = document.getElementById('entriesList');
            if (!container) return;
            if (!db.LoggedEntries || db.LoggedEntries.length === 0) {
                container.innerHTML = '<i>Noch keine Einträge erfasst.</i>';
                return;
            }
            container.innerHTML = '';
            db.LoggedEntries.forEach(item => {
                const div = document.createElement('div');
                div.className = item.isPause ? 'entry-item entry-pause' : 'entry-item';
                div.innerHTML = `<b>${item.date} (${item.from} - ${item.to})</b><br>` +
                                `<b>Dienst:</b> ${item.service} | <b>Tätigkeit:</b> ${item.activity}<br>` +
                                `<b>Details:</b> ${item.desc}`;
                container.appendChild(div);
            });
        }

        function importDataToCloud(event) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    db.ServiceToActivities = imported.ServiceToActivities || {};
                    db.ActivityToDescriptions = imported.ActivityToDescriptions || {};
                    if (imported.LoggedEntries) db.LoggedEntries = imported.LoggedEntries;
                    populateServices();
                    renderEntries();
                    await saveLocalAndCloud();
                    alert('Stammdaten & Einträge erfolgreich in Firebase hochgeladen!');
                } catch(err) {
                    alert('Fehler beim Lesen der JSON-Datei.');
                }
            };
            reader.readAsText(event.target.files[0]);
        }
    </script>
</body>
</html>
